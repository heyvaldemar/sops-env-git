name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOPS_VERSION: v3.11.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            sops-env-sync.sh hooks/pre-commit tests/test-hook.sh tests/test-sync.sh

  detector:
    name: Nineteen credential shapes, both directions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the hook real secrets and real code
        # Twelve credentials it must reject and seven benign strings it must
        # accept. A detector that has never been shown a real positive is not
        # a detector, and one that fires on a sudoers line gets widened until
        # it catches nothing.
        run: |
          chmod +x tests/test-hook.sh
          ./tests/test-hook.sh

  sync:
    name: Eight scenarios against real sops and age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sops and age
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          curl -sSLo /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
          sops --version | head -1
      - name: Run the sync suite
        run: |
          chmod +x tests/test-sync.sh
          ./tests/test-sync.sh
